name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # `src tests`, not bare `mypy`: `[tool.mypy]`'s `files = ["src"]` is the
      # convenience default for an interactive run, and taking it here would
      # leave `tests/` unchecked (measured: 45 source files bare, 84 with the
      # paths). This is the only mypy invocation in the repository, so these
      # explicit paths are what type-check `tests/` at all.
      - run: mypy src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -v

  # Package data that passes every test in the `test` job — where `src/` is
  # right there — and is missing from the built distribution is the classic
  # `src/` layout failure. WE2002's generated `we2002_english.ppf` is the file
  # at risk. This job reads it back out of an installed wheel.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Deliberately not `pip install -e ".[dev]"` like the jobs above. Measured
      # both orderings: editable first is survivable — installing the wheel
      # uninstalls the editable distribution, the import resolves to
      # site-packages and this job passes — but an editable install landing
      # *after* the wheel puts `src/` back in front and
      # `test_the_import_resolved_to_an_installed_package` fails. The working
      # order is luck, not design, so keep this environment to the builder, the
      # wheel and a test runner.
      - run: pip install build pytest
      - run: python -m build --wheel
      - run: pip install dist/*.whl
      # `-m packaging` is not optional. `addopts` deselects that marker so the
      # `test` job stays green, so without it this step collects five tests,
      # deselects all five and pytest exits 5. `cd /tmp` is belt and braces:
      # measured, the checkout cannot shadow the wheel today either way, because
      # pytest's `pythonpath = ["."]` inserts the repository root and the
      # package lives one level down under `src/`.
      - run: cd /tmp && python -m pytest "$GITHUB_WORKSPACE/tests/test_packaging.py" -m packaging -v
