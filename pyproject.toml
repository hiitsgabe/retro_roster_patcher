[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-roster-patcher"
version = "0.1.1"
description = "Patch real-world sports rosters into retro game ROMs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hiitsgabe" }]
keywords = ["rom", "patcher", "retro", "sports", "roster"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=10"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "build>=1.2"]

[project.scripts]
retro-roster = "retro_roster_patcher.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/hiitsgabe/retro_roster_patcher"
Repository = "https://github.com/hiitsgabe/retro_roster_patcher"
Issues = "https://github.com/hiitsgabe/retro_roster_patcher/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561. Without the marker a type checker ignores this package's annotations
# entirely for anyone importing it installed, which is every consumer that matters:
# the CLI, the Flutter/IPC embedding, and the tests. `_http.Transport` and the rest
# would be enforced only for callers inside `src`.
"retro_roster_patcher" = ["py.typed"]
"retro_roster_patcher.games.we2002.assets" = ["*.ppf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repository root on sys.path so tests can do
# `from tests.fixtures import synthetic_rom`. Without it, pytest only inserts
# each test file's own directory and the shared fixtures are unreachable.
pythonpath = ["."]
markers = [
    "real_rom: requires a real ROM, gated on RETRO_ROSTER_TEST_ROMS",
    "packaging: asserts the running import came from an installed distribution",
]
# `tests/test_packaging.py` fails on purpose against the source tree — that is
# the one assertion in it worth having. Deselected here so the default run stays
# green; the `wheel` CI job selects it back with `-m packaging` after installing
# the built wheel. Deselecting rather than skipping keeps the failure real: if
# that job ever loses its `-m packaging`, this line deselects every test it
# collected and pytest exits 5, which is red, not a silent pass. `-m` is not
# additive, though: any command-line `-m` replaces this one, so an unrelated
# `pytest -m "not real_rom"` re-selects the packaging tests and fails in the
# source tree. That is loud rather than silent, and it is the same door the
# wheel job walks through on purpose with `-m packaging` against a built wheel.
addopts = ["-m", "not packaging"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
